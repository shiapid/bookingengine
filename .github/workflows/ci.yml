name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Check staging activation and rollback
        run: bash test/staging-deploy.test.sh
      - run: npm run build

  staging:
    name: Prepare staging release
    needs: checks
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/develop'
          && vars.STAGING_PACKAGE_ENABLED == 'true' }}
    uses: ./.github/workflows/staging.yml

  deploy:
    name: Deploy to cPanel
    needs: staging
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop'
          && vars.STAGING_SSH_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      url: https://dev-booking.shiap.id
    concurrency:
      group: booking-engine-staging-ssh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.staging.outputs.artifact-id }}
          path: ${{ runner.temp }}/staging-artifact
      - name: Validate artifact
        working-directory: ${{ runner.temp }}/staging-artifact
        run: |
          sha256sum --strict --check SHA256SUMS
          python3 - <<'PY'
          import pathlib
          import tarfile

          with tarfile.open("booking-engine.tar.gz", "r:gz") as archive:
              members = {}
              for item in archive:
                  path = pathlib.PurePosixPath(item.name)
                  assert not path.is_absolute() and ".." not in path.parts, path
                  assert item.isfile() or item.isdir(), path
                  assert path not in members, path
                  assert not any(p.startswith(".env") or p.endswith((".pem", ".key")) for p in path.parts), path
                  members[path] = item

              for name in ("server.js", "package.json", ".next/BUILD_ID", "node_modules/next/package.json"):
                  assert members[pathlib.PurePosixPath(name)].isfile(), name
              assert any(
                  str(path).startswith(".next/static/") and path.suffix == ".css" and item.isfile()
                  for path, item in members.items()
              ), "Standalone archive has no stylesheet"
          PY
      - name: Transfer and activate release
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          ROLLBACK_DRILL_SHA: ${{ vars.STAGING_ROLLBACK_DRILL_SHA }}
        run: bash scripts/staging/transfer.sh
